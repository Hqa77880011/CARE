[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "care"
version = "0.1.0"
description = "CARE implementation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "matplotlib>=3.8,<4", "torch>=2.4,<3"]

[project.scripts]
care-report = "care.common:report"
care = "care.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
